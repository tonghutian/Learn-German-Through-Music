name: Patch study UX
on:
  push:
    paths:
      - '.github/workflows/patch-study-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- study-ux-v1 -->'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          old='<p style="text-align:center;color:#dfc09a;font-size:13px;margin-top:16px">For your own private uploads, use <a href="https://tonghutian.github.io/german/" style="color:#e5c477;font-weight:700">the private uploader</a>.</p>'
          new='''<div class="notice" style="margin-top:18px;text-align:center">
          <strong>Saved data</strong><br>
          <span class="tiny">Download a backup of your study progress and personal edits, or restore one later on this browser.</span>
          <div class="row" style="justify-content:center;margin-top:9px">
            <button class="btn ghost" id="downloadSavedData" type="button">Download saved data</button>
            <button class="btn ghost" id="restoreSavedData" type="button">Restore saved data</button>
            <input id="restoreSavedDataFile" type="file" accept="application/json,.json" class="hidden">
          </div>
        </div>
        <p style="text-align:center;color:#dfc09a;font-size:13px;margin-top:16px">For your own private uploads, use <a href="https://tonghutian.github.io/german/" target="_blank" rel="noopener noreferrer" style="color:#e5c477;font-weight:700">the private uploader</a>.</p>'''
          if old not in s:
              raise SystemExit('footer anchor not found')
          s=s.replace(old,new,1)
          inject=r'''
<!-- study-ux-v1 -->
<script>
(function(){
  const BACKUP_VERSION=1;
  function downloadBackup(){
    const payload={version:BACKUP_VERSION,app:'Learn German Through Music',exportedAt:new Date().toISOString(),progress:progress,settings:{active:active,levels:[...levels],studyMode:$('studyMode')?.value||'due',studyOrder:$('studyOrder')?.value||'level'}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='learn-german-through-music-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  async function restoreBackup(file){
    const text=await file.text();
    const data=JSON.parse(text);
    const incoming=data&&data.progress&&typeof data.progress==='object'?data.progress:null;
    if(!incoming) throw Error('This file does not contain saved study data.');
    localStorage.setItem(PROG,JSON.stringify(incoming));
    progress=incoming;
    if(data.settings){
      if(data.settings.active && catalog.musicals.some(m=>m.id===data.settings.active)){active=data.settings.active;$('studyMusical').value=active;}
      if(Array.isArray(data.settings.levels)&&data.settings.levels.length){levels=new Set(data.settings.levels.filter(x=>LEVELS.includes(x)));renderLevelPills();}
      if(data.settings.studyMode)$('studyMode').value=data.settings.studyMode;
      if(data.settings.studyOrder)$('studyOrder').value=data.settings.studyOrder;
    }
    alert('Saved data restored.');
    location.reload();
  }
  function wireBackup(){
    const d=$('downloadSavedData'),r=$('restoreSavedData'),f=$('restoreSavedDataFile');
    if(d)d.onclick=downloadBackup;
    if(r&&f){r.onclick=()=>f.click();f.onchange=()=>{const file=f.files?.[0];if(!file)return;restoreBackup(file).catch(e=>alert('Could not restore this file: '+e.message)).finally(()=>{f.value='';});};}
  }
  let lastCardId=null,lastCardNode=null;
  function syncAudio(){
    const cardEl=$('session')?.querySelector('.card');
    if(!cardEl){if(lastCardNode){stop();lastCardNode=null;lastCardId=null;}return;}
    const c=queue[idx];
    if(!c)return;
    if(c.id===lastCardId&&cardEl===lastCardNode)return;
    stop();lastCardId=c.id;lastCardNode=cardEl;
    setTimeout(()=>{
      const now=$('session')?.querySelector('.card');
      if(now===cardEl&&queue[idx]?.id===c.id)play(c);
    },120);
  }
  function addSongName(){
    const cardEl=$('session')?.querySelector('.card');
    const c=queue[idx];
    if(!cardEl||!c)return;
    const title=c.song||c.show||c.musical||'';
    if(!title||cardEl.querySelector('[data-song-name]'))return;
    const label=document.createElement('div');label.dataset.songName='1';label.className='tiny';label.style.marginTop='9px';label.textContent='Song: '+title;
    const front=cardEl.querySelector('.front');if(front)front.appendChild(label);
  }
  function observeSession(){
    const s=$('session');if(!s)return;
    const obs=new MutationObserver(()=>{syncAudio();addSongName();});
    obs.observe(s,{childList:true,subtree:true});
    setInterval(()=>{syncAudio();addSongName();},250);
  }
  wireBackup();
  observeSession();
})();
</script>
'''
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Improve study audio, song labels, and data backup [skip ci]'
          git push
