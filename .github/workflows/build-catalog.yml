name: Build musical catalog

on:
  push:
    branches: [main]
    paths:
      - 'music/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public interface
        run: python tools/patch_index.py
      - name: Build per-musical catalog
        run: python tools/build_catalog.py
      - name: Install free CEFR helper
        run: python -m pip install --disable-pip-version-check --no-input wordfreq
      - name: Fill missing translations and improve CEFR levels
        run: python tools/fill_translations.py
      - name: Publish generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/catalog.json data/musicals/
          git diff --cached --quiet && exit 0
          git commit -m 'Enrich built-in musical translations and CEFR levels'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
