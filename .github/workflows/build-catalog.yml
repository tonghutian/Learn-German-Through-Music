name: Build musical catalog

on:
  push:
    branches: [main]
    paths:
      - 'music/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public interface
        run: python tools/patch_index.py
      - name: Build catalog
        run: python tools/build_catalog.py
      - name: Install free language-quality tools
        run: python -m pip install --disable-pip-version-check --no-input wordfreq
      - name: Fill translations with the same free stack as the private site
        run: python tools/fill_translations.py
      - name: Commit generated site data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/catalog.json data/musicals/
          git diff --cached --quiet && exit 0
          git commit -m 'Improve free translations and CEFR levels'
          git push
