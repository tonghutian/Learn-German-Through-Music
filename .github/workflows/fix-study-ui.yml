name: Fix study UI

on:
  push:
    paths:
      - 'index.html'
      - 'README.md'
      - '.github/workflows/fix-study-ui.yml'
  workflow_dispatch:

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix flashcard edit save handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "renderWordsV3?.();renderWords?.();renderStudy?.();"
          new = "if(typeof renderWordsV3==='function')renderWordsV3();if(typeof renderWords==='function')renderWords();if(typeof renderStudy==='function')renderStudy();"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Fixed edit handler')
          else:
              print('Edit handler already fixed or pattern not present')
          PY
      - name: Commit fix if needed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "Fix flashcard edit save handler"
          git push
