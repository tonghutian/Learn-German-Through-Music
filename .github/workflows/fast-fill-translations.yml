name: Fast fill missing lyric translations
on:
  push:
    paths:
      - "translation-run-fast.trigger"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/musicals
            tools
            translation-run-fast.trigger
          sparse-checkout-cone-mode: true
      - name: Fill missing lyric lines
        run: python3 tools/fast_fill_lines.py
      - name: Commit translations
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/musicals data/translation_cache_lines.json
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git pull --rebase origin main
          git add data/musicals data/translation_cache_lines.json
          git commit -m "Fill missing lyric-line translations"
          git push
