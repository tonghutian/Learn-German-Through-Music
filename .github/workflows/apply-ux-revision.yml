name: Apply UX revision
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-ux-revision.yml'
      - 'assets/ux-revision-v3.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add UI script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/ux-revision-v3.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply revised study and vocabulary UI"
          git push
