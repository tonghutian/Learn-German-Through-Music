name: Rebuild study and words UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/final-study-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="final-study-ui-v1"' in s:
              print('Already patched')
              raise SystemExit(0)
          addon=r'''
<style id="final-study-ui-v1">
  #wordsView .top{align-items:center}
  #wordsView .filters{background:#f0e4cf;border:1px solid var(--line);padding:12px;border-radius:8px}
  #wordsView .filters select,#wordsView .filters input{height:42px;font-size:14px}
  #wordsView .tablewrap{border:0;background:transparent;overflow:auto}
  #wordsView table{min-width:1180px;border-collapse:separate;border-spacing:0}
  #wordsView th{padding:13px 10px;border-bottom:1px solid var(--line);font-size:12px;color:#5b493d}
  #wordsView td{padding:12px 10px;background:#f9f0df;border-bottom:1px solid #e7d9bd;vertical-align:middle}
  #wordsView tr:hover td{background:#fbf4e7}
  .final-word-input{width:100%;min-width:120px;height:46px;border:1px solid #d2b978;border-radius:7px;background:#fffdf8;padding:8px 11px;font:700 20px Georgia,serif;color:var(--ink)}
  .final-translation-input{width:100%;min-width:175px;height:46px;border:1px solid #d2b978;border-radius:7px;background:#fffdf8;padding:8px 11px;font-size:16px;color:var(--ink)}
  .final-line-input{width:100%;min-width:285px;height:46px;border:1px solid #d2b978;border-radius:7px;background:#fffdf8;padding:8px 11px;font:italic 15px Georgia,serif;color:#725b49}
  .final-level{width:105px;height:42px;border:1px solid #d2b978;border-radius:22px;background:#f4e2ad;padding:6px 12px;font-weight:700;color:#7a6129}
  .final-status{display:inline-flex;align-items:center;justify-content:center;min-width:82px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;text-transform:lowercase;border:1px solid #d8c9a8}
  .final-status.new{background:#fffdf8}.final-status.learning{background:#f2dfbf}.final-status.learned{background:#dcebdc;border-color:#91b795}
  .final-show{min-width:160px;max-width:205px;font-size:15px;line-height:1.35}.final-song{font-size:12px;color:var(--soft);margin-top:3px}
  .final-actions{display:flex;gap:6px;align-items:center}.final-icon{width:42px;height:42px;border:1px solid var(--bg);border-radius:6px;background:transparent;color:var(--bg);font-size:18px;cursor:pointer}.final-icon:hover{background:#efe0c5}
  .final-audio{width:42px;height:42px;border:1px solid var(--bg);border-radius:6px;background:var(--bg);color:var(--paper);cursor:pointer}
  .final-status-filter{min-width:140px}

  #studyView .studybox{max-width:680px}
  #studyView #setup{max-width:760px;margin:auto}
  .final-study-header{background:#f0e4cf;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:14px 0 16px}
  .final-study-header h2{margin:0;font:600 25px Georgia,serif}
  .final-study-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:5px;color:var(--soft);font-size:13px}
  .final-card{height:370px;perspective:1200px;cursor:pointer;margin-top:12px}
  .final-card .inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}
  .final-card.flipped .inner{transform:rotateY(180deg)}
  .final-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center;box-shadow:0 18px 40px -28px #15040a}
  .final-front{background:#fffdf8;border:1px solid #d2b978}
  .final-back{background:linear-gradient(155deg,#4b1320,#6b2333);color:var(--paper);transform:rotateY(180deg);border:1px solid var(--gold)}
  .final-word{font:700 48px Georgia,serif;margin-bottom:14px}
  .final-meaning{font:italic 32px Georgia,serif;line-height:1.2;margin:5px 0 14px}
  .final-source{font-size:15px;line-height:1.4;margin:0 0 15px;color:#f1dfc4}
  .final-lyric{font:italic 17px Georgia,serif;line-height:1.5;max-width:560px}
  .final-lyric-en{font-size:14px;line-height:1.45;max-width:560px;margin-top:7px;color:#e4cfaa}
  .final-card-status{font-size:13px;margin-top:10px;text-transform:lowercase;color:var(--soft)}
  .final-actions-row{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
  .final-actions-row .btn{min-width:120px}
  .final-quiz-title{text-align:center;font:600 27px Georgia,serif;margin:12px 0 4px}
  .final-quiz-sub{text-align:center;color:var(--soft);margin-bottom:16px}
  .final-quizgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .final-qcol{background:#f7eddc;border:1px solid var(--line);border-radius:8px;padding:10px}
  .final-qcol button{width:100%;padding:12px 13px;margin:4px 0;background:#fffdf8;border:1px solid var(--line);border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
  .final-qcol button.sel{background:#f2dfbf;border-color:#c9a960}.final-qcol button.ok{background:#dcebdc;border-color:#91b795}.final-qcol button.bad{background:#f4d8dc;border-color:#c8808b}
  .final-quiz-message{text-align:center;color:var(--soft);margin:14px 0}
  @media(max-width:760px){.final-card{height:320px}.final-word{font-size:38px}.final-meaning{font-size:27px}.final-quizgrid{grid-template-columns:1fr}.final-line-input{min-width:220px}}
</style>
<script id="final-study-ui-v1">
(function(){
  const KEY='ldm-progress-v4';
  const q=s=>String(s??'').toLowerCase();
  const status=c=>c.mastered?'learned':((c.reps||0)>0?'learning':'new');
  const saveP=()=>localStorage.setItem(KEY,JSON.stringify(progress));
  const esc2=s=>esc(s);
  let finalGroup=[],finalIndex=0,finalQueue=[],finalMixed=false,finalFlipped=false,finalQuizActive=false;

  function ensureStatusFilter(){
    const filters=document.querySelector('#wordsView .filters');
    if(!filters||document.getElementById('wordsStatusFilter'))return;
    const el=document.createElement('select');el.id='wordsStatusFilter';el.className='final-status-filter';
    el.innerHTML='<option value="">All status</option><option value="new">New</option><option value="learning">Learning</option><option value="learned">Learned</option>';
    filters.insertBefore(el,document.getElementById('wordsSearchField'));
    el.addEventListener('change',()=>{pageNo=1;renderFinalWords()});
  }
  function renderFinalWords(){
    const body=$('wordBody');if(!body)return;ensureStatusFilter();
    const lv=$('wordsLevel')?.value||'', field=$('wordsSearchField')?.value||'all', text=q($('wordsSearch')?.value||''), sf=$('wordsStatusFilter')?.value||'';
    let arr=(cards||[]).filter(c=>{
      if(lv&&c.level!==lv)return false;
      if(sf&&status(c)!==sf)return false;
      if(!text)return true;
      const w=q(c.word),l=q(c.line),t=q(c.translation);
      if(field==='word')return w.includes(text);
      if(field==='lyrics')return l.includes(text);
      if(field==='translation')return t.includes(text);
      return w.includes(text)||l.includes(text)||t.includes(text);
    });
    const total=arr.length,per=50,pages=Math.max(1,Math.ceil(total/per));pageNo=Math.min(Math.max(1,pageNo||1),pages);
    arr=arr.slice((pageNo-1)*per,pageNo*per);
    body.innerHTML=arr.map(c=>{
      const id=esc2(c.id),st=status(c);
      return `<tr>
        <td><input class="final-word-input" data-f="word" data-id="${id}" value="${esc2(c.word||'')}"></td>
        <td><select class="final-level" data-f="level" data-id="${id}">${LEVELS.map(x=>`<option value="${x}" ${x===c.level?'selected':''}>${x}</option>`).join('')}</select></td>
        <td><span class="final-status ${st}">${st}</span></td>
        <td><input class="final-translation-input" data-f="translation" data-id="${id}" value="${esc2(c.translation||'')}"></td>
        <td><input class="final-line-input" data-f="line" data-id="${id}" value="${esc2(c.line||'')}"></td>
        <td class="final-show"><b>${esc2(c.show||c.musical||'')}</b><div class="final-song">${esc2(c.song||'')}</div></td>
        <td><button class="final-audio" data-audio="${id}" title="Play lyric line">▶</button></td>
        <td><div class="final-actions"><button class="final-icon" data-edit="${id}" title="Edit">✎</button><button class="final-icon" data-delete="${id}" title="Delete">×</button></div></td>
      </tr>`;
    }).join('');
    $('page').textContent=`${pageNo} / ${pages} · ${total} words`;
    $('wordStatus').textContent=active?`${active.name} · ${total} words`:'Choose a Musical.';
    $('prev').disabled=pageNo<=1;$('next').disabled=pageNo>=pages;
  }
  function updateFinal(id,field,val){const p=progress[id]||{};progress[id]={...p,[field]:val};saveP();const c=(cards||[]).find(x=>x.id===id);if(c)c[field]=val}
  function bindFinalWords(){
    ensureStatusFilter();
    const body=$('wordBody');if(!body||body.dataset.finalBound)return;body.dataset.finalBound='1';
    body.addEventListener('change',e=>{const el=e.target,id=el.dataset.id;if(!id)return;updateFinal(id,el.dataset.f,el.dataset.f==='level'?el.value:el.value);renderFinalWords()});
    body.addEventListener('click',e=>{
      const a=e.target.closest('[data-audio]');if(a){const c=(cards||[]).find(x=>x.id===a.dataset.audio);if(c)play(c);return}
      const ed=e.target.closest('[data-edit]');if(ed){openEdit(ed.dataset.edit);return}
      const de=e.target.closest('[data-delete]');if(de&&confirm('Delete this word from saved browser data?')){delete progress[de.dataset.delete];saveP();cards=cards.filter(x=>x.id!==de.dataset.delete);renderFinalWords()}
    });
  }
  function searchBindings(){
    ['wordsSearch','wordsSearchField','wordsLevel'].forEach(id=>{const el=$(id);if(el&&!el.dataset.finalSearch){el.dataset.finalSearch='1';el.addEventListener(id==='wordsSearch'?'input':'change',()=>{pageNo=1;renderFinalWords()})}});
    const wm=$('wordsMusical');if(wm&&!wm.dataset.finalMusical){wm.dataset.finalMusical='1';wm.addEventListener('change',()=>setTimeout(renderFinalWords,120))}
  }

  function loadAll(){
    return Promise.all((catalog.musicals||[]).map(async m=>{const r=await fetch(m.cardsUrl+'?v='+Date.now(),{cache:'no-store'});const d=await r.json();return (d.cards||[]).map(merge)})).then(xs=>xs.flat());
  }
  async function studyCards(){
    const val=$('studyMusical')?.value;if(val==='__all__')return loadAll();
    if(!val)return [];
    return (await getMusical(val)).cards;
  }
  function applyStudyMode(arr){
    const mode=$('studyMode')?.value||'all';let x=arr.filter(c=>!c.excluded&&levels.has(c.level));
    if(mode==='learning')x=x.filter(c=>!c.mastered&&(c.reps||0)>0);
    else if(mode==='mastered')x=x.filter(c=>c.mastered);
    else if(mode==='due')x=x.filter(c=>!c.mastered);
    return x;
  }
  function randomize(a){return a.slice().sort(()=>Math.random()-.5)}
  function renderFinalCard(){
    const c=finalGroup[finalIndex];if(!c){renderFinalQuiz();return}stop();finalFlipped=false;
    const st=status(c), source=[c.show||c.musical,c.song].filter(Boolean).join(' · ');
    $('session').innerHTML=`<div class="final-study-header"><h2>${finalMixed?'Mixed musicals':'Study'}</h2><div class="final-study-meta"><span>Group of 10 · ${finalIndex+1} / ${finalGroup.length}</span><span>${esc2(st)}</span></div></div>
      <div class="final-card" id="finalCard"><div class="inner">
        <div class="final-face final-front"><div class="final-word">${esc2(c.word)}</div><div class="leveltag">${esc2(c.level)}</div><div class="final-card-status">${esc2(st)}</div><div class="tiny" style="margin-top:16px">Tap to flip</div></div>
        <div class="final-face final-back"><div class="final-word">${esc2(c.word)}</div><div class="final-meaning">${esc2(c.translation||'—')}</div><div class="final-source">${esc2(source||'Source not listed')}</div><div class="final-lyric">${esc2(c.line||'')}</div><div class="final-lyric-en">${esc2(c.lineTranslation||'')}</div></div>
      </div></div>
      <div class="final-actions-row"><button class="btn ghost" id="finalAgain">↻ Again</button><button class="btn ghost" id="finalEdit">✎ Edit</button><button class="btn primary" id="finalKnow">Know it ✓</button></div>`;
    $('finalCard').onclick=e=>{if(e.target.closest('button'))return;finalFlipped=!finalFlipped;$('finalCard').classList.toggle('flipped',finalFlipped)};
    $('finalAgain').onclick=()=>rateFinal(false);$('finalKnow').onclick=()=>rateFinal(true);$('finalEdit').onclick=()=>openEdit(c.id);play(c);
  }
  function rateFinal(known){
    const c=finalGroup[finalIndex];if(!c)return;const p=progress[c.id]||{};const reps=(p.reps||0)+1;progress[c.id]={...p,reps,mastered:known};saveP();c.reps=reps;c.mastered=known;finalIndex++;renderFinalCard();
  }
  function renderFinalQuiz(){
    const items=finalGroup.slice(0,10);if(!items.length){finishFinal();return}
    let left=randomize(items),right=randomize(items),picked=null,matched=new Set();
    $('session').innerHTML=`<div class="final-quiz-title">Matching quiz</div><div class="final-quiz-sub">Match the words from this group of ${items.length}.</div><div class="final-quizgrid"><div class="final-qcol" id="finalQL"></div><div class="final-qcol" id="finalQR"></div></div><div class="final-quiz-message" id="finalQM">Click a German word, then its English translation.</div>`;
    const draw=()=>{$('finalQL').innerHTML=left.map(c=>`<button data-l="${esc2(c.id)}" ${matched.has(c.id)?'disabled':''} class="${matched.has(c.id)?'ok':''}">${esc2(c.word)}</button>`).join('');$('finalQR').innerHTML=right.map(c=>`<button data-r="${esc2(c.id)}" ${matched.has(c.id)?'disabled':''} class="${matched.has(c.id)?'ok':''}">${esc2(c.translation||'')}</button>`).join('');if(matched.size===items.length){$('finalQM').textContent='✓ Complete';const b=document.createElement('button');b.className='btn primary';b.textContent='Next group →';b.onclick=nextFinalGroup;$('session').appendChild(b)}};
    $('session').onclick=e=>{const l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]');if(l){picked=l.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));l.classList.add('sel')}if(r&&picked){if(r.dataset.r===picked){matched.add(picked);picked=null;draw()}else{$('finalQM').textContent='Try again.';r.classList.add('bad');setTimeout(()=>r.classList.remove('bad'),450)}}};draw();
  }
  function nextFinalGroup(){const rem=finalQueue.slice(finalGroup.length);if(!rem.length){finishFinal();return}finalQueue=rem;finalGroup=finalQueue.slice(0,10);finalIndex=0;renderFinalCard()}
  function finishFinal(){stop();$('session').innerHTML='<div style="text-align:center;padding:45px 10px"><div class="final-quiz-title">Session complete ✓</div><p class="muted">Your learning progress is saved in this browser.</p><button class="btn primary" id="finalBack">Back to setup</button></div>';$('finalBack').onclick=()=>{$('session').classList.add('hidden');$('setup').classList.remove('hidden');ensureStudyDefaults()}}
  async function finalStart(){
    stop();try{let arr=applyStudyMode(await studyCards());arr=randomize(arr);if(arr.length<10){alert('There are fewer than 10 words in this selection. Choose another selection or include more levels.');return}finalMixed=$('studyMusical')?.value==='__all__';finalQueue=arr;finalGroup=finalQueue.slice(0,10);finalIndex=0;$('setup').classList.add('hidden');$('session').classList.remove('hidden');renderFinalCard()}catch(e){alert('Could not load study words: '+e.message)}}
  function ensureStudyDefaults(){const o=$('studyOrder');if(o){o.innerHTML='<option value="random" selected>Random (default)</option><option value="level">Easiest first</option><option value="alpha">A–Z</option>'}const m=$('studyMode');if(m){m.innerHTML='<option value="all">All words</option><option value="due">Not learned</option><option value="learning">Learning</option><option value="mastered">Learned</option>'}}
  function initFinal(){
    ensureStudyDefaults();bindFinalWords();searchBindings();renderFinalWords();
    const start=$('start');if(start&&!start.dataset.finalStart){start.dataset.finalStart='1';start.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();finalStart()},true)}
    const sh=$('shuffleSetup');if(sh&&!sh.dataset.finalShuffle){sh.dataset.finalShuffle='1';sh.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();const o=$('studyOrder');if(o)o.value='random'},true)}
    const sv=document.querySelector('[data-view="study"]');if(sv&&!sv.dataset.finalView){sv.dataset.finalView='1';sv.addEventListener('click',()=>setTimeout(ensureStudyDefaults,80))}
    const wv=document.querySelector('[data-view="words"]');if(wv&&!wv.dataset.finalView){wv.dataset.finalView='1';wv.addEventListener('click',()=>setTimeout(renderFinalWords,80))}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(initFinal,50));else setTimeout(initFinal,50);
})();
</script>
'''
          s=s.replace('</html>',addon+'\n</html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Rebuild study and words UI to match requested layout'
          git push
