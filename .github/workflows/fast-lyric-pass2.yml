name: Fast lyric translation pass
on:
  push:
    paths:
      - "fast-translation-marker.txt"
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/musicals
            tools
          sparse-checkout-cone-mode: true
      - name: Fill missing lines
        run: python3 tools/fast_fill_lines.py
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: Fill missing lyric-line translations
