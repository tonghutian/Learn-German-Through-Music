name: Fill missing translations
on:
  push:
    paths:
      - "translation-run.trigger"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fill missing translations
        run: python3 tools/fill_translations.py
      - name: Commit translations
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/musicals data/translation_cache.json
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "Fill missing German lyric translations"
          git push
